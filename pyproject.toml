[project]
name = "transactionguard"
version = "0.1.0"
description = "Explainable transaction-risk detection: risk signals for analyst review, not proof of fraud."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Anupam Rout" }]
dependencies = [
    # --- data & ML ---
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "optuna>=4.1",
    "shap>=0.46",
    "mlflow>=3.0",
    "joblib>=1.4",
    "scipy>=1.14",
    # --- monitoring ---
    "evidently>=0.7",
    # --- API ---
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.12",
    # --- async jobs ---
    "celery[redis]>=5.4",
    "redis>=5.2",
    # --- utilities ---
    "structlog>=24.4",
    "httpx>=0.28",
    "typer>=0.15",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6"]

[project.scripts]
tg = "transactionguard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transactionguard"]

[tool.uv]
# Reproducibility + supply-chain hygiene: ignore any package published after this date.
# Bump deliberately (and re-run `uv lock`) rather than drifting silently.
exclude-newer = "2026-09-30T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S"]
ignore = ["S101", "RUF012", "N803", "N806", "N812", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a real PostgreSQL server (TG_TEST_DATABASE_URL)",
    "redis: needs a real Redis server (TG_TEST_REDIS_URL)",
    "slow: trains models or downloads data; skipped unless -m slow",
    "kafka: needs a real Kafka broker",
]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*", "ignore::FutureWarning:mlflow.*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
